<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📝 ToDo List</h1>

    <div id="ws-status" class="ws-disconnected">
      🔴 Отключено
    </div>

    <div class="form-block">
      <input type="text" id="input-title" placeholder="Название задачи" />
      <input type="text" id="input-desc" placeholder="Описание (необязательно)" />
      <button onclick="createTask()">➕ Добавить</button>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <h3>Редактировать задачу</h3>
        <input type="text" id="edit-title" placeholder="Название" />
        <input type="text" id="edit-desc" placeholder="Описание" />
        <label>
          <input type="checkbox" id="edit-completed" /> Выполнено
        </label>
        <div class="modal-buttons">
          <button onclick="saveEdit()">💾 Сохранить</button>
          <button onclick="closeModal()">✖ Отмена</button>
        </div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Название</th>
          <th>Описание</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="tasks-body"></tbody>
    </table>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
