server {
    listen 80;

    # Раздача статических файлов (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Проксирование REST API запросов
    location /api/ {
        proxy_pass http://todo-backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Проксирование WebSocket соединений socket.io
    # socket.io использует путь /socket.io/ для handshake и long-polling
    location /socket.io/ {
        proxy_pass http://todo-backend:4000/socket.io/;
        proxy_http_version 1.1;

        # Эти два заголовка ОБЯЗАТЕЛЬНЫ для WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        # Таймаут для долгих WS соединений (по умолчанию 60s — мало)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
